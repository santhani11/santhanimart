<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SanthaniMart - Users</title>
<style>
  body { font-family: Arial, sans-serif; padding: 16px; }
  input, button { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  th, td { border: 1px solid #ccc; padding: 6px; text-align: left; font-size: 14px; }
</style>
</head>
<body>
<h2>Registered Users (Admin)</h2>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Admin password">
<button onclick="loadUsers()">Show users</button>
<p id="msg"></p>
<table>
  <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Role</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
async function loadUsers() {
  const msg = document.getElementById("msg");
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  msg.textContent = "Loading... the backend may take a minute to wake up.";
  try {
    const response = await fetch("https://santhanimart.onrender.com/api/admin/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      })
    });
    const data = await response.json();
    if (!response.ok) {
      msg.textContent = data.message || ("Failed: " + response.status);
      return;
    }
    msg.textContent = data.length + " user(s)";
    data.forEach(function (u, i) {
      const tr = document.createElement("tr");
      [i + 1, u.name, u.email, u.role].forEach(function (v) {
        const td = document.createElement("td");
        td.textContent = v;
        tr.appendChild(td);
      });
      rows.appendChild(tr);
    });
  } catch (e) {
    msg.textContent = "Cannot connect to backend.";
  }
}
</script>
</body>
</html>
